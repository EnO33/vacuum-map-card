name: Setup
description: >-
  Installs pnpm from the packageManager field and Node.js from engines.node in package.json,
  with the pnpm store cached, then installs dependencies from the frozen lockfile.
  Run actions/checkout first: a local action is only available once the repository is checked out.
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
