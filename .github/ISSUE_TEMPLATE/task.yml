name: Task
description: A unit of work that fits in one pull request (used by maintainers and planning).
labels: ["type:task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links to ADRs, research documents, files, upstream docs.
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Observable, testable checkboxes.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: links
    attributes:
      label: Links
      description: "Part of #E, Blocked by #N."
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      value: |
        - [ ] Tests first, checks green (lint, typecheck, test with coverage, build)
        - [ ] Reviews: code, security, and UX for UI changes
        - [ ] Live test in Home Assistant for UI changes
        - [ ] READMEs (EN and FR) and translations updated if user-visible
